name: Import Command Center Reference Images

on:
  push:
    branches: [main]
    paths:
      - "maximus-optimus-reference-images.zip"
      - "Frank-Mazerati-QA-Robots-Reference.jpg"
      - "Maximus-Optimus-Command-Center-Scene-Reference.jpg"
      - ".github/workflows/import-reference-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-reference-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Place approved visual references in their folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/reference
          if [ -f "maximus-optimus-reference-images.zip" ]; then
            mkdir -p /tmp/maximus-reference-import
            unzip -o "maximus-optimus-reference-images.zip" -d /tmp/maximus-reference-import
            find /tmp/maximus-reference-import -type f \\( \
              -name "Frank-Mazerati-QA-Robots-Reference.jpg" -o \
              -name "Maximus-Optimus-Command-Center-Scene-Reference.jpg" \
            \\) -exec cp {} public/images/reference/ \\;
          fi
          for file in \
            "Frank-Mazerati-QA-Robots-Reference.jpg" \
            "Maximus-Optimus-Command-Center-Scene-Reference.jpg"; do
            if [ -f "$file" ]; then
              cp "$file" public/images/reference/
            fi
          done
          test -s public/images/reference/Frank-Mazerati-QA-Robots-Reference.jpg
          test -s public/images/reference/Maximus-Optimus-Command-Center-Scene-Reference.jpg
          rm -f maximus-optimus-reference-images.zip
          rm -f Frank-Mazerati-QA-Robots-Reference.jpg Maximus-Optimus-Command-Center-Scene-Reference.jpg

      - name: Commit imported references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/reference/ maximus-optimus-reference-images.zip Frank-Mazerati-QA-Robots-Reference.jpg Maximus-Optimus-Command-Center-Scene-Reference.jpg
          if git diff --cached --quiet; then
            echo "No reference-image changes to commit."
            exit 0
          fi
          git commit -m "assets: organize Command Center visual reference images"
          git push origin HEAD:main
