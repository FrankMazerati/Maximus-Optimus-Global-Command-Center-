name: Autonomous SAM 4-Agent Pipeline

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: sam-pipeline-main
  cancel-in-progress: false

permissions:
  contents: write
  models: read
  issues: write

jobs:
  build-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI tools and project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @google/gemini-cli
          pip install --break-system-packages aider-chat
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          elif [[ -f package.json ]]; then
            npm install --no-audit --no-fund
          fi
          chmod +x scripts/free-ai-router.sh

      - name: Run supervised SAM agent sequence through free AI router
        id: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        shell: bash
        run: |
          set -uo pipefail
          failures=()

          run_agent() {
            local prompt_file="$1"
            echo "::group::SAM agent: $prompt_file"
            if ./scripts/free-ai-router.sh "$prompt_file"; then
              echo "Completed: $prompt_file"
            else
              echo "::error::All AI tiers failed for $prompt_file"
              failures+=("$prompt_file")
            fi
            echo "::endgroup::"
          }

          # Sequential by design: each agent sees the preceding agent's changes.
          run_agent "_sam/agents/orchestrator-worker.md"
          run_agent "_sam/agents/supabase-worker.md"
          run_agent "_sam/agents/frontend-worker.md"
          run_agent "_sam/agents/image-worker.md"
          run_agent "_sam/agents/orchestrator-worker.md"

          printf 'agent_failures=%s\n' "${failures[*]}" >> "$GITHUB_OUTPUT"
          if (( ${#failures[@]} > 0 )); then
            echo "::error::One or more SAM agent calls exhausted all configured AI tiers."
            exit 1
          fi

      - name: Verify build, lint, and tests
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          BUILD_STATUS=not_configured
          LINT_STATUS=not_configured
          TEST_STATUS=not_configured

          if [[ -f package.json ]]; then
            if npm run | grep -qE '^[[:space:]]+build([[:space:]]|$)'; then
              npm run build && BUILD_STATUS=passed || BUILD_STATUS=failed
            fi
            if npm run | grep -qE '^[[:space:]]+lint([[:space:]]|$)'; then
              npm run lint && LINT_STATUS=passed || LINT_STATUS=failed
            fi
            if npm run | grep -qE '^[[:space:]]+test([[:space:]]|$)'; then
              npm test -- --runInBand && TEST_STATUS=passed || TEST_STATUS=failed
            fi
          fi

          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          echo "lint_status=$LINT_STATUS" >> "$GITHUB_OUTPUT"
          echo "test_status=$TEST_STATUS" >> "$GITHUB_OUTPUT"

          if [[ "$BUILD_STATUS" == failed || "$LINT_STATUS" == failed || "$TEST_STATUS" == failed ]]; then
            exit 1
          fi

      - name: Commit and rebase latest main before pushing
        id: commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SAM Autonomous Bot"
          git config user.email "sam-bot@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "chore(sam): supervised autonomous cycle"
          # Rebase our local cycle commit on the latest main before attempting push.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Post cycle report to progress issue
        if: always() && steps.commit.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FILE="sdocs/CYCLE_REPORTS.md"
          [[ -s "$REPORT_FILE" ]] || { echo "No cycle report to post."; exit 0; }

          LATEST_ENTRY="$(awk '
            /^## Cycle — / {
              if (block != "") last = block
              block = $0 ORS
              next
            }
            block != "" { block = block $0 ORS }
            END { if (block != "") last = block; printf "%s", last }
          ' "$REPORT_FILE")"
          [[ -n "$LATEST_ENTRY" ]] || { echo "No structured cycle entry found."; exit 0; }

          ISSUE_NUMBER="$(gh issue list --state all --limit 100 --json number,title --jq '.[] | select(.title == "🤖 Autonomous Build Progress Log") | .number' | head -n 1)"
          if [[ -z "$ISSUE_NUMBER" ]]; then
            ISSUE_URL="$(gh issue create --title "🤖 Autonomous Build Progress Log" --body "Automated progress updates from the supervised SAM 4-agent pipeline are posted here after each scheduled cycle.")"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$LATEST_ENTRY"
